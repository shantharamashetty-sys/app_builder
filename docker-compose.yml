services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appbuilder
      POSTGRES_PASSWORD: appbuilder
      POSTGRES_DB: appbuilder
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

# api service intentionally omitted — add once apps/api/Dockerfile exists (Phase 2).

volumes:
  postgres_data:
